<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DeskMoment Studio — Admin</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f6f6f8;
    --text: #111111;
    --text-muted: #666666;
    --border: #e2e2e6;
    --accent: #111827;
    --accent-soft: #e5e7eb;
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.06);
    --ok: #15803d;
    --ok-bg: #ecfdf3;
    --bad: #b91c1c;
    --bad-bg: #fef2f2;
    --new: #b45309;
    --new-bg: #fffbeb;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans KR", sans-serif;
    color: var(--text); background: var(--bg-alt); line-height: 1.6;
  }
  .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 20px 80px; }
  header.top {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner { max-width: 960px; margin: 0 auto; padding: 0 20px; height: 58px; display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 700; letter-spacing: 0.04em; font-size: 0.92rem; white-space: nowrap; }
  .logo span { color: var(--text-muted); font-weight: 500; }
  .top-nav { display: flex; gap: 4px; margin-left: 8px; overflow-x: auto; }
  .top-nav a { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .top-nav a:hover { background: var(--accent-soft); color: var(--text); }
  a { color: inherit; text-decoration: none; }
  .top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #days { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 5px 8px; font-size: 0.78rem; background: var(--bg); }
  #logout { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; color: var(--text-muted); }
  #logout:hover { color: var(--text); }
  .chip { font-size: 0.7rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--text-muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }

  /* 로그인 */
  #login-view { max-width: 380px; margin: 80px auto 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 28px; box-shadow: var(--shadow-soft); }
  #login-view h1 { font-size: 1.1rem; margin: 0 0 4px; }
  #login-view p { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 20px; }
  #login-view label { display: block; font-size: 0.78rem; font-weight: 600; margin: 12px 0 4px; }
  #login-view input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--bg); }
  #login-view button { width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: var(--radius-md); background: var(--accent); color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  #login-view button:disabled { opacity: 0.5; }
  #login-msg { font-size: 0.8rem; margin-top: 12px; color: var(--bad); white-space: pre-line; }

  /* 앱 섹션 */
  .app-sect { margin-top: 28px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px 22px; scroll-margin-top: 70px; }
  .sect-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .sect-head h2 { font-size: 1.05rem; margin: 0; }
  .sect-head .sub { font-size: 0.76rem; color: var(--text-muted); }
  .sect-err { border: 1px solid #fecaca; background: var(--bad-bg); color: var(--bad); border-radius: var(--radius-md); padding: 12px 16px; font-size: 0.82rem; white-space: pre-line; margin-bottom: 10px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; }
  .stat .k { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.03em; }
  .stat .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }

  .charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  @media (max-width: 640px) { .charts2 { grid-template-columns: 1fr; } }
  .chart-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px 6px; }
  .chart-card h3 { font-size: 0.76rem; margin: 0 0 6px; font-weight: 600; color: var(--text-muted); }
  .chart-card svg { width: 100%; height: auto; display: block; }
  .bar { fill: var(--accent); }
  .bar:hover { fill: #4b5563; }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .ax { font-size: 10px; fill: var(--text-muted); }

  details.top-ev-wrap { margin-bottom: 4px; }
  details.top-ev-wrap summary { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 4px 0; }
  table.top-ev { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; font-size: 0.82rem; margin-top: 6px; }
  table.top-ev th, table.top-ev td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--border); }
  table.top-ev thead th { border-top: none; font-size: 0.7rem; color: var(--text-muted); background: var(--bg-alt); }
  table.top-ev td:nth-child(2), table.top-ev td:nth-child(3), table.top-ev th:nth-child(2), table.top-ev th:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }

  .inq-title { font-size: 0.85rem; font-weight: 700; margin: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
  .inq-title .cnt { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
  .card { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; }
  .card.new-item { border-color: var(--new); box-shadow: 0 0 0 3px var(--new-bg); }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .badge.replied { background: var(--ok-bg); color: var(--ok); }
  .badge.newbadge { background: var(--new-bg); color: var(--new); }
  .when { font-size: 0.73rem; color: var(--text-muted); margin-left: auto; }
  .msg { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
  .meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .reply-box { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .reply-box textarea { width: 100%; min-height: 56px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 11px; font-size: 0.85rem; font-family: inherit; resize: vertical; background: var(--bg); }
  .reply-actions { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .reply-actions button, .reply-actions a.mail-btn {
    border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-md);
    padding: 5px 13px; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .reply-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .reply-note { font-size: 0.7rem; color: var(--text-muted); }
  .save-state { font-size: 0.73rem; }
  .save-state.ok { color: var(--ok); }
  .save-state.bad { color: var(--bad); }
  .empty { border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 18px; text-align: center; color: var(--text-muted); font-size: 0.82rem; }
  .fb-link { font-size: 0.76rem; color: var(--text-muted); margin: 8px 0 0; }
  .fb-link a { text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo">DM STUDIO <span>/ admin</span></div>
    <nav class="top-nav" id="top-nav" hidden>
      <a href="#sect-baby">👶 아기의 하루</a>
      <a href="#sect-haru">📅 오늘하루</a>
      <a href="#sect-lotto">🎰 로또정석</a>
    </nav>
    <div class="top-right">
      <select id="days" hidden>
        <option value="7">7일</option>
        <option value="14" selected>14일</option>
        <option value="30">30일</option>
      </select>
      <span class="chip" id="conn-chip" hidden></span>
      <button id="logout" hidden>로그아웃</button>
    </div>
  </div>
</header>

<div class="container">

  <div id="login-view">
    <h1>어드민 로그인</h1>
    <p>두 Supabase 프로젝트(아기의 하루 · 오늘하루/로또정석)에 같은 계정으로 로그인합니다.</p>
    <label>이메일</label>
    <input id="email" type="email" autocomplete="username" value="seongjong@deskmomentstudio.com">
    <label>비밀번호</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn">로그인</button>
    <div id="login-msg"></div>
  </div>

  <div id="app-view" hidden>

    <section class="app-sect" id="sect-baby">
      <div class="sect-head"><h2>👶 아기의 하루</h2><span class="sub">내부테스트 · 문의 실시간 + 서버 지표</span></div>
      <div id="baby-err"></div>
      <div id="baby-an"><div class="empty">불러오는 중…</div></div>
      <div class="inq-title">문의 <span class="cnt" id="baby-cnt"></span></div>
      <div id="list-baby"><div class="empty">불러오는 중…</div></div>
    </section>

    <section class="app-sect" id="sect-haru">
      <div class="sect-head"><h2>📅 오늘하루</h2><span class="sub">건의 실시간 + 이벤트 지표 · 답변은 앱에 표시됨</span></div>
      <div id="haru-err"></div>
      <div id="haru-an"><div class="empty">불러오는 중…</div></div>
      <div class="inq-title">건의 <span class="cnt" id="haru-cnt"></span></div>
      <div id="list-haru"><div class="empty">불러오는 중…</div></div>
    </section>

    <section class="app-sect" id="sect-lotto">
      <div class="sect-head"><h2>🎰 로또정석</h2><span class="sub">이벤트 지표 (서버 문의함 없음 — 문의는 스토어/메일)</span></div>
      <div id="lotto-err"></div>
      <div id="lotto-an"><div class="empty">불러오는 중…</div></div>
    </section>

  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const PROJECTS = {
  baby: {
    label: '아기의 하루',
    url: 'https://xnlypjfwqisastckqbwh.supabase.co',
    anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhubHlwamZ3cWlzYXN0Y2txYndoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMDc4NDYsImV4cCI6MjA5MjU4Mzg0Nn0.pAT8UoKS0GfQeFs4IPgcaAN61rVyLAmaD2ela9HGoE8',
  },
  rsscu: {
    label: '오늘하루·로또',
    url: 'https://rsscukpbsiiyfgbdfups.supabase.co',
    anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzc2N1a3Bic2lpeWZnYmRmdXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyODgzNTUsImV4cCI6MjA3Njg2NDM1NX0.H4vbpHPsFS7-z4iWKTbRrZTl0VSqzDlWkum3G0BnYwc',
  },
};

const sb = {};
for (const [key, p] of Object.entries(PROJECTS)) {
  sb[key] = createClient(p.url, p.anon, {
    auth: { storageKey: 'dm-admin-' + key, persistSession: true, autoRefreshToken: true },
  });
}

const $ = (s) => document.querySelector(s);
const connected = { baby: false, rsscu: false };
const state = { baby: [], haru: [] };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function kst(ts) {
  try {
    return new Date(ts).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return ts; }
}
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

// ---------- 로그인 ----------
async function tryLogin(email, password) {
  const msgs = [];
  for (const [k, p] of Object.entries(PROJECTS)) {
    const { error } = await sb[k].auth.signInWithPassword({ email, password });
    if (error) {
      msgs.push(`✗ ${p.label}: ${error.message}`);
    } else {
      const { data: me } = await sb[k].auth.getUser();
      const { data: adminRow, error: aerr } = await sb[k].from('admin_users').select('user_id').eq('user_id', me.user.id).maybeSingle();
      if (aerr || !adminRow) {
        msgs.push(`✗ ${p.label}: admin_users 화이트리스트에 없음 (setup SQL 확인)`);
        await sb[k].auth.signOut();
      } else {
        connected[k] = true;
      }
    }
  }
  return msgs;
}

async function restoreSessions() {
  for (const k of Object.keys(PROJECTS)) {
    const { data } = await sb[k].auth.getSession();
    if (data.session) {
      const { data: adminRow } = await sb[k].from('admin_users').select('user_id').eq('user_id', data.session.user.id).maybeSingle();
      connected[k] = !!adminRow;
    }
  }
}

function enterApp() {
  $('#login-view').hidden = true;
  $('#app-view').hidden = false;
  $('#top-nav').hidden = false;
  $('#days').hidden = false;
  $('#logout').hidden = false;
  const chip = $('#conn-chip');
  const bad = Object.entries(PROJECTS).filter(([k]) => !connected[k]).map(([, p]) => p.label);
  chip.hidden = false;
  if (bad.length) { chip.className = 'chip bad'; chip.textContent = bad.join('·') + ' 미연결'; }
  else { chip.className = 'chip ok'; chip.textContent = '모두 연결됨'; }
  loadAll();
  subscribeRealtime();
}

$('#login-btn').addEventListener('click', async () => {
  const btn = $('#login-btn'); btn.disabled = true;
  $('#login-msg').textContent = '';
  const msgs = await tryLogin($('#email').value.trim(), $('#password').value);
  btn.disabled = false;
  if (connected.baby || connected.rsscu) {
    enterApp();
    if (msgs.length) alert(msgs.join('\n'));
  } else {
    $('#login-msg').textContent = msgs.join('\n') || '로그인 실패';
  }
});
$('#password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#login-btn').click(); });
$('#logout').addEventListener('click', async () => {
  for (const k of Object.keys(PROJECTS)) await sb[k].auth.signOut();
  location.reload();
});
$('#days').addEventListener('change', loadAll);

// ---------- 데이터 로드 (앱별 섹션에 병렬로) ----------
async function loadAll() {
  const days = Number($('#days').value);
  loadBaby(days);
  loadHaru(days);
  loadLotto(days);
}

function statHtml(pairs) {
  return `<div class="stat-row">${pairs.map(([k, v]) =>
    `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>`;
}

function topEvHtml(rows) {
  const trs = (rows ?? []).map((r) =>
    `<tr><td>${esc(r.event)}</td><td>${fmt(r.cnt)}</td><td>${fmt(r.devices)}</td></tr>`).join('');
  return `<details class="top-ev-wrap"><summary>이벤트 상위 20</summary>
    <table class="top-ev"><thead><tr><th>이벤트</th><th>횟수</th><th>기기</th></tr></thead>
    <tbody>${trs || '<tr><td colspan="3">데이터 없음</td></tr>'}</tbody></table></details>`;
}

async function loadBaby(days) {
  if (!connected.baby) {
    $('#baby-err').innerHTML = '<div class="sect-err">프로젝트 미연결 — 로그인 실패 또는 화이트리스트 없음</div>';
    $('#baby-an').innerHTML = ''; $('#list-baby').innerHTML = '';
    return;
  }
  const [an, inq] = await Promise.all([
    sb.baby.rpc('admin_daily_stats', { p_days: days }),
    sb.baby.from('inquiries').select('*').order('created_at', { ascending: false }).limit(100),
  ]);
  if (an.error) {
    $('#baby-an').innerHTML = `<div class="sect-err">지표 조회 실패: ${esc(an.error.message)}</div>`;
  } else {
    const d = an.data;
    const sum = (k) => d.reduce((a, r) => a + Number(r[k]), 0);
    const today = d[d.length - 1] ?? {};
    $('#baby-an').innerHTML =
      statHtml([[`신규 가입 (${days}일)`, fmt(sum('new_users'))], [`기록 수 (${days}일)`, fmt(sum('records'))], ['오늘 활성 아기', fmt(today.active_babies ?? 0)]]) +
      `<div class="charts2">
        <div class="chart-card"><h3>일별 기록 수 (수유·수면·기저귀)</h3>${barChart(d, 'records')}</div>
        <div class="chart-card"><h3>일별 활성 아기</h3>${barChart(d, 'active_babies')}</div>
      </div>
      <p class="fb-link">행동 이벤트 분석은 <a href="https://console.firebase.google.com" target="_blank" rel="noopener">Firebase 콘솔</a></p>`;
  }
  if (inq.error) {
    $('#baby-err').innerHTML = `<div class="sect-err">문의 조회 실패: ${esc(inq.error.message)}</div>`;
  } else {
    state.baby = inq.data.map(normBaby);
    renderList('baby');
  }
}

async function loadHaru(days) {
  if (!connected.rsscu) {
    $('#haru-err').innerHTML = '<div class="sect-err">프로젝트 미연결 — 로그인 실패 또는 화이트리스트 없음</div>';
    $('#haru-an').innerHTML = ''; $('#list-haru').innerHTML = '';
    return;
  }
  const [an, top, fb] = await Promise.all([
    sb.rsscu.rpc('admin_daily_stats', { p_app: 'oneulharu', p_days: days }),
    sb.rsscu.rpc('admin_top_events', { p_app: 'oneulharu', p_days: days }),
    sb.rsscu.from('oneulharu_feedback').select('*').order('created_at', { ascending: false }).limit(100),
  ]);
  if (an.error) {
    $('#haru-an').innerHTML = `<div class="sect-err">지표 조회 실패: ${esc(an.error.message)}</div>`;
  } else {
    $('#haru-an').innerHTML = anBlock(an.data, top.data, days);
  }
  if (fb.error) {
    $('#haru-err').innerHTML = `<div class="sect-err">건의 조회 실패: ${esc(fb.error.message)}</div>`;
  } else {
    state.haru = fb.data.map(normHaru);
    renderList('haru');
  }
}

async function loadLotto(days) {
  if (!connected.rsscu) {
    $('#lotto-err').innerHTML = '<div class="sect-err">프로젝트 미연결 — 로그인 실패 또는 화이트리스트 없음</div>';
    $('#lotto-an').innerHTML = '';
    return;
  }
  const [an, top] = await Promise.all([
    sb.rsscu.rpc('admin_daily_stats', { p_app: 'lotto', p_days: days }),
    sb.rsscu.rpc('admin_top_events', { p_app: 'lotto', p_days: days }),
  ]);
  if (an.error) {
    $('#lotto-an').innerHTML = `<div class="sect-err">지표 조회 실패: ${esc(an.error.message)}</div>`;
  } else {
    $('#lotto-an').innerHTML = anBlock(an.data, top.data, days) +
      '<p class="fb-link">서버 <code>app_events</code> 기준 — 화면·행동 상세는 Firebase Analytics 병행</p>';
  }
}

function anBlock(d, top, days) {
  const sum = (k) => d.reduce((a, r) => a + Number(r[k]), 0);
  const today = d[d.length - 1] ?? {};
  return statHtml([[`이벤트 (${days}일)`, fmt(sum('events'))], ['오늘 DAU (기기)', fmt(today.dau ?? 0)], ['일평균 이벤트', fmt(Math.round(sum('events') / Math.max(1, d.length)))]]) +
    `<div class="charts2">
      <div class="chart-card"><h3>일별 이벤트</h3>${barChart(d, 'events')}</div>
      <div class="chart-card"><h3>일별 DAU (고유 기기)</h3>${barChart(d, 'dau')}</div>
    </div>` + topEvHtml(top);
}

// ---------- 문의 카드 ----------
function normBaby(r) {
  return {
    app: 'baby', key: 'baby-' + r.id, id: r.id,
    message: r.message, createdAt: r.created_at,
    reply: r.reply, contactEmail: r.contact_email,
    meta: [r.app_version && 'v' + r.app_version, r.platform, r.os_version && 'OS ' + r.os_version, r.is_guest ? '게스트' : '계정'].filter(Boolean),
  };
}
function normHaru(r) {
  return {
    app: 'haru', key: 'haru-' + r.device_id + '-' + r.created_at,
    deviceId: r.device_id,
    message: r.content, createdAt: r.created_at,
    reply: r.reply,
    meta: [r.app_ver && 'v' + r.app_ver, r.platform, '기기 ' + String(r.device_id).slice(0, 8)].filter(Boolean),
  };
}

function cardHtml(it, isNew = false) {
  const replied = !!(it.reply && it.reply.trim());
  const mailBtn = it.app === 'baby' && it.contactEmail
    ? `<a class="mail-btn" data-key="${esc(it.key)}" href="#">📧 메일로 답장</a>` : '';
  const emailChip = it.app === 'baby'
    ? `<span>${it.contactEmail ? '✉️ ' + esc(it.contactEmail) : '✉️ 회신 주소 없음'}</span>` : '';
  const note = it.app === 'baby'
    ? '저장된 답변은 기록용 — 사용자 전달은 메일로'
    : '저장하면 앱의 건의 내역에서 사용자에게 보입니다';
  return `<div class="card ${isNew ? 'new-item' : ''}" data-key="${esc(it.key)}">
    <div class="card-top">
      ${isNew ? '<span class="badge newbadge">NEW</span>' : ''}
      ${replied ? '<span class="badge replied">답변됨</span>' : ''}
      <span class="when">${esc(kst(it.createdAt))}</span>
    </div>
    <div class="msg">${esc(it.message)}</div>
    <div class="meta">${it.meta.map((m) => `<span>${esc(m)}</span>`).join('')}${emailChip}</div>
    <div class="reply-box">
      <textarea placeholder="답변…">${esc(it.reply ?? '')}</textarea>
      <div class="reply-actions">
        <button class="primary save-btn" data-key="${esc(it.key)}">답변 저장</button>
        ${mailBtn}
        <span class="save-state"></span>
        <span class="reply-note">${note}</span>
      </div>
    </div>
  </div>`;
}

function renderList(app) {
  const el = $('#list-' + app);
  const items = state[app];
  el.innerHTML = items.length
    ? items.map((it) => cardHtml(it)).join('')
    : '<div class="empty">아직 없음 — 새로 오면 실시간으로 뜹니다</div>';
  $('#' + app + '-cnt').textContent = items.length ? items.length + '건' : '';
}

async function saveReply(key, card) {
  const it = [...state.baby, ...state.haru].find((x) => x.key === key);
  if (!it) return;
  const text = card.querySelector('textarea').value;
  const stateEl = card.querySelector('.save-state');
  stateEl.textContent = '저장 중…'; stateEl.className = 'save-state';
  let error;
  if (it.app === 'baby') {
    ({ error } = await sb.baby.from('inquiries')
      .update({ reply: text || null, replied_at: text ? new Date().toISOString() : null })
      .eq('id', it.id));
  } else {
    ({ error } = await sb.rsscu.from('oneulharu_feedback')
      .update({ reply: text || null })
      .eq('device_id', it.deviceId).eq('created_at', it.createdAt));
  }
  if (error) {
    stateEl.textContent = '실패: ' + error.message; stateEl.className = 'save-state bad';
  } else {
    it.reply = text;
    stateEl.textContent = '저장됨 ✓'; stateEl.className = 'save-state ok';
    if (text.trim() && !card.querySelector('.badge.replied')) {
      card.querySelector('.card-top .when').insertAdjacentHTML('beforebegin', '<span class="badge replied">답변됨</span>');
    }
  }
}

document.addEventListener('click', (e) => {
  const save = e.target.closest('.save-btn');
  if (save) { saveReply(save.dataset.key, save.closest('.card')); return; }
  const mail = e.target.closest('.mail-btn');
  if (mail) {
    e.preventDefault();
    const it = state.baby.find((x) => x.key === mail.dataset.key);
    const reply = mail.closest('.card').querySelector('textarea').value;
    const body = `안녕하세요, 아기의 하루입니다.\n\n${reply}\n\n---- 보내주신 문의 ----\n${it.message}`;
    location.href = `mailto:${encodeURIComponent(it.contactEmail)}?subject=${encodeURIComponent('[아기의 하루] 문의 답변드립니다')}&body=${encodeURIComponent(body)}`;
  }
});

function subscribeRealtime() {
  if (connected.baby) {
    sb.baby.channel('inq-baby')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'inquiries' }, (payload) => {
        const it = normBaby(payload.new);
        state.baby.unshift(it);
        $('#list-baby').querySelector('.empty')?.remove();
        $('#list-baby').insertAdjacentHTML('afterbegin', cardHtml(it, true));
        $('#baby-cnt').textContent = state.baby.length + '건';
        document.title = '● 새 문의 — DM Studio Admin';
      })
      .subscribe();
  }
  if (connected.rsscu) {
    sb.rsscu.channel('inq-haru')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'oneulharu_feedback' }, (payload) => {
        const it = normHaru(payload.new);
        state.haru.unshift(it);
        $('#list-haru').querySelector('.empty')?.remove();
        $('#list-haru').insertAdjacentHTML('afterbegin', cardHtml(it, true));
        $('#haru-cnt').textContent = state.haru.length + '건';
        document.title = '● 새 문의 — DM Studio Admin';
      })
      .subscribe();
  }
}

// ---------- 차트 (단일 시리즈 막대, 호버 툴팁) ----------
function barChart(rows, valueKey, labelKey = 'day') {
  const W = 380, H = 130, PAD_L = 38, PAD_R = 6, PAD_T = 10, PAD_B = 20;
  const iw = W - PAD_L - PAD_R, ih = H - PAD_T - PAD_B;
  const max = Math.max(1, ...rows.map((r) => Number(r[valueKey])));
  const n = rows.length;
  const gap = 2;
  const bw = Math.max(2, iw / n - gap);
  const ticks = [0, Math.round(max / 2), max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 추이">`;
  for (const t of ticks) {
    const y = PAD_T + ih - (t / max) * ih;
    s += `<line class="grid-line" x1="${PAD_L}" y1="${y}" x2="${W - PAD_R}" y2="${y}"/>`;
    s += `<text class="ax" x="${PAD_L - 5}" y="${y + 3}" text-anchor="end">${fmt(t)}</text>`;
  }
  rows.forEach((r, i) => {
    const v = Number(r[valueKey]);
    const x = PAD_L + i * (iw / n) + gap / 2;
    const h = Math.max(v > 0 ? 2 : 0, (v / max) * ih);
    const y = PAD_T + ih - h;
    const rx = Math.min(3, bw / 2);
    s += `<path class="bar" d="M${x},${y + h} V${y + rx} Q${x},${y} ${x + rx},${y} H${x + bw - rx} Q${x + bw},${y} ${x + bw},${y + rx} V${y + h} Z">
      <title>${esc(r[labelKey])} — ${fmt(v)}</title></path>`;
    const d = new Date(r[labelKey] + 'T00:00:00');
    if (i === 0 || i === n - 1 || (n > 10 && i % Math.ceil(n / 5) === 0 && i < n - 2)) {
      s += `<text class="ax" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${d.getMonth() + 1}/${d.getDate()}</text>`;
    }
  });
  s += '</svg>';
  return s;
}
